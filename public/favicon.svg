<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Degradado suave para la gorra -->
    <linearGradient id="favCapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Resplandor sutil para el glifo / -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Contenedor Squircle Oscuro Fintech / Dev -->
  <rect width="128" height="128" rx="26" fill="#0d1117" stroke="#334155" stroke-width="2.5" />

  <!-- Sombra base de la gorra -->
  <ellipse cx="64" cy="113" rx="48" ry="5.5" fill="#000000" opacity="0.45" />

  <!-- Visera -->
  <path d="M 14 96 C 26 88, 102 88, 114 96 C 120 100, 108 107, 64 107 C 20 107, 8 100, 14 96 Z"
        fill="#1e293b" stroke="#334155" stroke-width="2" stroke-linejoin="round" />

  <!-- Corona / Domo de la gorra -->
  <path d="M 22 92 C 21 46, 43 21, 64 21 C 85 21, 107 46, 106 92 Z"
        fill="url(#favCapGrad)" stroke="#334155" stroke-width="2" stroke-linejoin="round" />

  <!-- Botón superior -->
  <ellipse cx="64" cy="21" rx="7" ry="3.5" fill="#475569" stroke="#334155" stroke-width="1" />

  <!-- Ribete de la visera -->
  <path d="M 17 97 C 32 91, 96 91, 111 97"
        fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />

  <!-- Glifo Central: {/} -->
  <g filter="url(#favGlow)" transform="translate(64, 63)" text-anchor="middle" dominant-baseline="central">
    <text x="-19" y="-1" fill="#f0f6fc" font-family="monospace, 'Fira Code', 'JetBrains Mono', Courier" font-size="25" font-weight="700">{</text>
    <text x="0" y="-1.5" fill="#38bdf8" font-family="monospace, 'Fira Code', 'JetBrains Mono', -apple-system, sans-serif" font-size="24" font-weight="900">/</text>
    <text x="19" y="-1" fill="#f0f6fc" font-family="monospace, 'Fira Code', 'JetBrains Mono', Courier" font-size="25" font-weight="700">}</text>
  </g>
</svg>
